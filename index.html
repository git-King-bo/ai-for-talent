<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none';"
    />
    <title>兔子看板娘</title>
    <style>
      :root {
        color-scheme: light;
        --bubble-bg: rgba(255, 255, 255, 0.96);
        --bubble-border: rgba(36, 42, 54, 0.14);
        --bubble-text: #273142;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
        cursor: grab;
      }

      body.is-dragging {
        cursor: grabbing;
      }

      .stage {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: end center;
        padding: 8px 10px;
      }

      .bubble {
        position: absolute;
        right: 12px;
        bottom: 242px;
        max-width: 226px;
        min-height: 42px;
        padding: 10px 13px;
        border: 1px solid var(--bubble-border);
        border-radius: 8px;
        background: var(--bubble-bg);
        color: var(--bubble-text);
        font:
          600 14px/1.45 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        letter-spacing: 0;
        box-shadow: 0 12px 28px rgba(31, 38, 51, 0.16);
        opacity: 0;
        transform: translateY(8px) scale(0.96);
        transform-origin: right bottom;
        transition:
          opacity 180ms ease,
          transform 180ms ease;
        pointer-events: none;
      }

      .bubble::after {
        content: "";
        position: absolute;
        right: 38px;
        bottom: -7px;
        width: 12px;
        height: 12px;
        border-right: 1px solid var(--bubble-border);
        border-bottom: 1px solid var(--bubble-border);
        background: var(--bubble-bg);
        transform: rotate(45deg);
      }

      .bubble.is-visible {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      .pet-shell {
        width: 240px;
        height: 240px;
        display: grid;
        place-items: center;
        transform-origin: 50% 86%;
      }

      .pet-shell.is-idle {
        animation: idle-sway 2.7s ease-in-out infinite;
      }

      .pet-shell.is-popping {
        animation: click-pop 360ms cubic-bezier(0.2, 1.35, 0.3, 1);
      }

      .pet {
        width: 238px;
        height: 238px;
        display: block;
        object-fit: contain;
        pointer-events: auto;
        -webkit-user-drag: none;
        filter: drop-shadow(0 14px 18px rgba(42, 46, 58, 0.2));
      }

      @keyframes click-pop {
        0% {
          transform: scale(1);
        }

        42% {
          transform: scale(1.1);
        }

        100% {
          transform: scale(1);
        }
      }

      @keyframes idle-sway {
        0%,
        100% {
          transform: rotate(-2deg) translateX(-2px);
        }

        50% {
          transform: rotate(2deg) translateX(2px);
        }
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="兔子看板娘">
      <div class="bubble" id="bubble" role="status" aria-live="polite"></div>
      <div class="pet-shell" id="petShell">
        <img
          class="pet"
          id="pet"
          src="assets/bunnyBase/idle_01.png"
          alt="兔子看板娘"
          draggable="false"
        />
      </div>
    </main>

    <script>
      const BUNNY_BASE = "assets/bunnyBase";
      const ACTIONS = {
        idle: {
          loop: true,
          frames: [
            { image: `${BUNNY_BASE}/idle_01.png`, duration: 310 },
            { image: `${BUNNY_BASE}/idle_02.png`, duration: 300 },
            { image: `${BUNNY_BASE}/idle_03.png`, duration: 320 },
            { image: `${BUNNY_BASE}/idle_04.png`, duration: 300 },
          ],
        },
        blink: {
          loop: false,
          frames: [
            { image: `${BUNNY_BASE}/blink_01.png`, duration: 190 },
            { image: `${BUNNY_BASE}/blink_02.png`, duration: 220 },
            { image: `${BUNNY_BASE}/blink_01.png`, duration: 190 },
          ],
        },
        turn: {
          loop: false,
          frames: [
            { image: `${BUNNY_BASE}/turn_01.png`, duration: 250 },
            { image: `${BUNNY_BASE}/turn_02.png`, duration: 250 },
            { image: `${BUNNY_BASE}/turn_01.png`, duration: 220 },
          ],
          dialogues: ["我看到你啦。", "嗯？叫我吗？"],
        },
        kiss: {
          loop: false,
          frames: [
            { image: `${BUNNY_BASE}/kiss_01.png`, duration: 260 },
            { image: `${BUNNY_BASE}/kiss_02.png`, duration: 260 },
            { image: `${BUNNY_BASE}/kiss_03.png`, duration: 260 },
            { image: `${BUNNY_BASE}/kiss_04.png`, duration: 320 },
          ],
          dialogues: ["啾~", "送你一个飞吻。"],
        },
      };

      const DIALOGUES = [
        "今天也要顺顺利利。",
        "需要我陪你盯一下进度吗？",
        "喝口水，再继续。",
        "我在这里，随时待命。",
        "哒哒，兔子巡逻中。",
        "这个点子看起来不错。",
        "保存一下进度会很安心。",
      ];

      const CLICK_MOVE_TOLERANCE = 5;
      const IDLE_DELAY = 4200;
      const BUBBLE_DURATION = 3600;
      const BLINK_MIN_DELAY = 2000;
      const BLINK_MAX_DELAY = 4000;

      const pet = document.getElementById("pet");
      const petShell = document.getElementById("petShell");
      const bubble = document.getElementById("bubble");

      let dragStart = null;
      let movedDuringDrag = false;
      let idleTimer = null;
      let bubbleTimer = null;
      let blinkTimer = null;
      let actionTimer = null;
      let activeAction = "idle";
      let frameIndex = 0;
      let isPlayingOneShot = false;
      let isDraggingPet = false;

      function pickRandom(items) {
        return items[Math.floor(Math.random() * items.length)];
      }

      function wait(duration) {
        return new Promise((resolve) => {
          window.setTimeout(resolve, duration);
        });
      }

      function preloadImages() {
        const images = Object.values(ACTIONS)
          .flatMap((action) => action.frames)
          .map((frame) => frame.image);

        for (const src of [...new Set(images)]) {
          const image = new Image();
          image.src = src;
        }
      }

      function resetIdleTimer() {
        petShell.classList.remove("is-idle");
        window.clearTimeout(idleTimer);
        idleTimer = window.setTimeout(() => {
          petShell.classList.add("is-idle");
        }, IDLE_DELAY);
      }

      function showBubble(text) {
        bubble.textContent = text;
        bubble.classList.add("is-visible");
        window.clearTimeout(bubbleTimer);
        bubbleTimer = window.setTimeout(() => {
          bubble.classList.remove("is-visible");
        }, BUBBLE_DURATION);
      }

      function setPetImage(src) {
        if (pet.getAttribute("src") !== src) {
          pet.src = src;
        }
      }

      function playClickAnimation() {
        petShell.classList.remove("is-popping");
        void petShell.offsetWidth;
        petShell.classList.add("is-popping");
      }

      function clearActionTimer() {
        window.clearTimeout(actionTimer);
        actionTimer = null;
      }

      function playIdleLoop() {
        const action = ACTIONS.idle;
        activeAction = "idle";
        frameIndex = 0;
        clearActionTimer();

        function nextFrame() {
          if (isPlayingOneShot) return;

          const frame = action.frames[frameIndex];
          setPetImage(frame.image);
          frameIndex = (frameIndex + 1) % action.frames.length;
          actionTimer = window.setTimeout(nextFrame, frame.duration);
        }

        nextFrame();
      }

      async function playOneShotAction(name) {
        if (isPlayingOneShot) return;

        const action = ACTIONS[name];
        if (!action) return;

        isPlayingOneShot = true;
        activeAction = name;
        clearActionTimer();
        petShell.classList.remove("is-idle");

        for (const frame of action.frames) {
          setPetImage(frame.image);
          await wait(frame.duration);
        }

        isPlayingOneShot = false;
        playIdleLoop();
        resetIdleTimer();
      }

      function scheduleBlink() {
        window.clearTimeout(blinkTimer);
        const delay =
          BLINK_MIN_DELAY + Math.random() * (BLINK_MAX_DELAY - BLINK_MIN_DELAY);

        blinkTimer = window.setTimeout(async () => {
          if (!isPlayingOneShot && !isDraggingPet && activeAction === "idle") {
            await playOneShotAction("blink");
          }
          scheduleBlink();
        }, delay);
      }

      async function onPetClick() {
        if (isPlayingOneShot) return;

        const actionName = Math.random() > 0.45 ? "kiss" : "turn";
        const action = ACTIONS[actionName];

        playClickAnimation();
        showBubble(pickRandom(action.dialogues || DIALOGUES));
        resetIdleTimer();
        await playOneShotAction(actionName);
      }

      window.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;

        dragStart = {
          x: event.screenX,
          y: event.screenY,
          target: event.target,
        };
        movedDuringDrag = false;
        isDraggingPet = true;
        document.body.classList.add("is-dragging");
        window.petWindow.startDrag();
        resetIdleTimer();
      });

      window.addEventListener("pointermove", (event) => {
        if (!dragStart) return;

        const deltaX = Math.abs(event.screenX - dragStart.x);
        const deltaY = Math.abs(event.screenY - dragStart.y);

        if (deltaX > CLICK_MOVE_TOLERANCE || deltaY > CLICK_MOVE_TOLERANCE) {
          movedDuringDrag = true;
        }

        if (movedDuringDrag) {
          window.petWindow.moveDrag();
        }
      });

      window.addEventListener("pointerup", () => {
        if (!dragStart) return;

        document.body.classList.remove("is-dragging");
        window.petWindow.endDrag();

        if (!movedDuringDrag && dragStart.target.closest(".pet")) {
          onPetClick();
        }

        isDraggingPet = false;
        dragStart = null;
      });

      window.addEventListener("pointercancel", () => {
        dragStart = null;
        isDraggingPet = false;
        document.body.classList.remove("is-dragging");
        window.petWindow.endDrag();
      });

      window.addEventListener("mousemove", resetIdleTimer);
      window.addEventListener("keydown", resetIdleTimer);

      preloadImages();
      playIdleLoop();
      scheduleBlink();
      resetIdleTimer();
    </script>
  </body>
</html>
